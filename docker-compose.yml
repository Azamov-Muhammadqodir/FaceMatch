name: facematch

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facematch}
      POSTGRES_USER: ${POSTGRES_USER:-facematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facematch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: deploy/minio
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.24-alpine}
        BASE_IMAGE: ${ALPINE_IMAGE:-alpine:3.22}
    image: facematch/minio:local
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: facematch/api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-facematch};Username=${POSTGRES_USER:-facematch};Password=${POSTGRES_PASSWORD:-facematch}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Minio__Bucket: ${MINIO_BUCKET:-facematch}
      Processing__MaxDegreeOfParallelism: ${PROCESSING_PARALLELISM:-2}
      FaceRecognition__DefaultMinSimilarity: ${MIN_SIMILARITY:-0.4}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
  miniodata:
