name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: facematch
          POSTGRES_USER: facematch
          POSTGRES_PASSWORD: facematch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U facematch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      # MinIO no longer ships container images, so run the server binary built from source.
      - name: Start MinIO
        run: |
          go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
          mkdir -p "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin nohup "$(go env GOPATH)/bin/minio" server "$RUNNER_TEMP/minio" --address :9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done

      - name: Download sample photos
        run: ./scripts/download-samples.sh

      - name: Build
        run: dotnet build -c Release

      - name: Test
        env:
          FACEMATCH_INTEGRATION: "1"
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"
