<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceMatch</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
      --accent: #2f6fed; --accent-text: #fff; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --panel: #1a1f26; --text: #e6e9ee; --muted: #98a2b3; --border: #2a313b; --accent: #5b8cff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 20px; }
    header .stats { color: var(--muted); font-size: 13px; }
    header a { margin-left: auto; color: var(--accent); font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 16px; padding: 16px 24px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 16px; } }
    section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .drop { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted); cursor: pointer; }
    .drop.over { border-color: var(--accent); color: var(--accent); }
    input[type=file] { display: none; }
    button { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    label.field { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; color: var(--muted); }
    label.field input { width: 90px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    .log { max-height: 220px; overflow: auto; font-size: 12px; margin-top: 10px; }
    .log div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); padding: 3px 0; }
    .log span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .Accepted, .Completed { color: var(--ok); } .Duplicate, .Pending { color: var(--warn); } .Rejected, .Failed { color: var(--bad); }
    .query { position: relative; display: inline-block; max-width: 100%; margin-top: 12px; }
    .query img { max-width: 100%; max-height: 320px; display: block; border-radius: 6px; }
    .box { position: absolute; border: 2px solid var(--warn); border-radius: 3px; cursor: pointer; }
    .box.sel { border-color: var(--ok); box-shadow: 0 0 0 2px rgba(22,163,74,.35); }
    .hint { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); cursor: pointer; }
    .card .frame { position: relative; aspect-ratio: 4/3; background: #000; overflow: hidden; }
    .card .frame img { width: 100%; height: 100%; object-fit: contain; }
    .card .meta { padding: 8px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
    .card .meta img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
    .card .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sim { margin-left: auto; font-weight: 600; }
    dialog { border: 0; border-radius: 10px; padding: 0; max-width: 95vw; max-height: 95vh; background: #000; }
    dialog::backdrop { background: rgba(0,0,0,.7); }
    dialog .query { margin: 0; } dialog .query img { max-height: 90vh; max-width: 95vw; }
  </style>
</head>
<body>
<header>
  <h1>FaceMatch</h1>
  <span class="stats" id="stats">…</span>
  <a href="/scalar">API hujjatlari</a>
</header>
<main>
  <section>
    <h2>1. Rasmlarni yuklash</h2>
    <div class="drop" id="uploadDrop">Rasmlarni shu yerga tashlang yoki bosing<br><small>bir vaqtda yuzlab rasm</small></div>
    <input type="file" id="uploadInput" accept="image/*" multiple>
    <div class="log" id="uploadLog"></div>
  </section>

  <section>
    <h2>2. Yuz bo'yicha qidirish</h2>
    <div class="drop" id="searchDrop">Qidirilayotgan odamning rasmini tashlang</div>
    <input type="file" id="searchInput" accept="image/*">
    <label class="field">Minimal o'xshashlik (0–1) <input type="number" id="minSim" step="0.05" min="0" max="1" value="0.4"></label>
    <label class="field">Maksimal natija <input type="number" id="topK" min="1" max="200" value="50"></label>
    <div id="queryWrap"></div>
    <p class="hint" id="searchInfo"></p>
    <div class="grid" id="results"></div>
  </section>
</main>
<dialog id="viewer"></dialog>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function wireDrop(drop, input, onFiles) {
    drop.onclick = () => input.click();
    input.onchange = () => { onFiles([...input.files]); input.value = ''; };
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); onFiles([...e.dataTransfer.files]); };
  }

  async function refreshStats() {
    try {
      const s = await (await fetch('/api/stats')).json();
      $('stats').textContent = `${s.images} rasm · ${s.faces} yuz · navbatda ${s.pending + s.processing} · xato ${s.failed}`;
    } catch { $('stats').textContent = 'statistika mavjud emas'; }
  }

  // Upload in batches so very large selections do not create one giant request.
  async function upload(files) {
    const batchSize = 20;
    for (let i = 0; i < files.length; i += batchSize) {
      const form = new FormData();
      files.slice(i, i + batchSize).forEach((f) => form.append('files', f));
      const res = await fetch('/api/images', { method: 'POST', body: form });
      if (!res.ok) { log(`Xato: ${res.status}`, 'Rejected'); continue; }
      for (const r of await res.json()) log(r.fileName, r.outcome, r.error);
      refreshStats();
    }
  }

  function log(name, outcome, error) {
    const row = document.createElement('div');
    row.innerHTML = `<span title="${esc(error || name)}">${esc(name)}</span><span class="${esc(outcome)}">${esc(outcome)}</span>`;
    $('uploadLog').prepend(row);
  }

  // Draws face boxes over an <img>, scaling from natural image pixels to rendered pixels.
  function overlay(container, img, boxes, onClick) {
    const draw = () => {
      container.querySelectorAll('.box').forEach((b) => b.remove());
      const sx = img.clientWidth / img.naturalWidth, sy = img.clientHeight / img.naturalHeight;
      boxes.forEach((b, i) => {
        const el = document.createElement('div');
        el.className = 'box' + (b.selected ? ' sel' : '');
        Object.assign(el.style, { left: `${b.x * sx}px`, top: `${b.y * sy}px`, width: `${b.width * sx}px`, height: `${b.height * sy}px` });
        if (onClick) el.onclick = (e) => { e.stopPropagation(); onClick(i); };
        container.appendChild(el);
      });
    };
    img.complete && img.naturalWidth ? draw() : (img.onload = draw);
  }

  let queryFile = null;

  async function search(file, faceIndex) {
    queryFile = file;
    const form = new FormData();
    form.append('file', file);
    const params = new URLSearchParams({ topK: $('topK').value, minSimilarity: $('minSim').value });
    if (faceIndex != null) params.set('faceIndex', faceIndex);
    $('searchInfo').textContent = 'Qidirilmoqda…';
    $('results').innerHTML = '';

    const res = await fetch(`/api/search?${params}`, { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) { $('searchInfo').textContent = data.detail || 'Xato'; return; }

    const url = URL.createObjectURL(file);
    $('queryWrap').innerHTML = `<div class="query"><img src="${url}" alt="so'rov"></div>`;
    const wrap = $('queryWrap').firstChild;
    overlay(wrap, wrap.querySelector('img'),
      data.queryFaces.map((f) => ({ ...f.box, selected: f.index === data.selectedFaceIndex })),
      (i) => search(queryFile, i));

    if (data.queryFaces.length === 0) { $('searchInfo').textContent = 'Rasmda yuz topilmadi.'; return; }
    $('searchInfo').textContent =
      `${data.matches.length} ta yuz, ${data.matchedImages} ta rasmda topildi (o'xshashlik ≥ ${data.minSimilarity}).` +
      (data.queryFaces.length > 1 ? ' Boshqa odamni qidirish uchun rasmdagi ramkani bosing.' : '');

    for (const m of data.matches) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="frame"><img loading="lazy" src="${m.imageUrl}" alt=""></div>
        <div class="meta"><img src="${m.thumbnailUrl}" alt=""><span class="name" title="${esc(m.fileName)}">${esc(m.fileName)}</span>
        <span class="sim">${(m.similarity * 100).toFixed(1)}%</span></div>`;
      card.onclick = () => view(m);
      $('results').appendChild(card);
    }
  }

  function view(m) {
    const d = $('viewer');
    d.innerHTML = `<div class="query"><img src="${m.imageUrl}" alt=""></div>`;
    d.onclick = () => d.close();
    d.showModal(); // must be visible before measuring the rendered image size
    const wrap = d.firstChild;
    overlay(wrap, wrap.querySelector('img'), [{ ...m.box, selected: true }]);
  }

  wireDrop($('uploadDrop'), $('uploadInput'), upload);
  wireDrop($('searchDrop'), $('searchInput'), (files) => files[0] && search(files[0]));
  refreshStats();
  setInterval(refreshStats, 5000);
</script>
</body>
</html>
